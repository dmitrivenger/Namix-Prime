<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namix Prime — The Company Behind Phoenix Swap</title>
  <meta name="description" content="Namix Prime LLC is a fintech holding company in Tbilisi, Georgia — the corporate entity behind Phoenix Swap, Georgia's regulated digital asset exchange." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       NAMIX PRIME — Colors & Type Foundations
    ============================================================ */
    :root {
      --blue-700: #1F3FB5;
      --blue-600: #2A4FD8;
      --blue-500: #3362EE;
      --blue-400: #5187F2;
      --blue-300: #59ADED;
      --blue-200: #9CCBF5;
      --blue-100: #CFE4FA;
      --blue-50:  #EAF2FE;
      --grad-brand: linear-gradient(100deg, #3362EE 0%, #59ADED 100%);
      --grad-brand-soft: linear-gradient(135deg, #EAF2FE 0%, #F6FAFF 100%);
      --navy-900: #0C1630;
      --navy-800: #111E3D;
      --ink-900:  #16223D;
      --ink-700:  #33405C;
      --slate-600:#54607A;
      --slate-500:#6B7689;
      --slate-400:#94A0B5;
      --line-200: #E4EBF5;
      --line-100: #EEF3FA;
      --bg-page:    #FFFFFF;
      --bg-tint:    #F5F8FE;
      --bg-tint-2:  #EFF4FD;
      --surface:    #FFFFFF;
      --surface-glass: rgba(255,255,255,0.72);
      --success: #1E9E6A;
      --success-bg: #E6F6EF;
      --warn:    #C9871F;
      --warn-bg: #FBF1DD;
      --danger:  #D2452F;
      --font-display: 'Manrope', system-ui, -apple-system, sans-serif;
      --font-body:    'Manrope', system-ui, -apple-system, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --r-pill: 999px;
      --sh-xs: 0 1px 2px rgba(16,36,86,0.06);
      --sh-sm: 0 2px 8px rgba(16,36,86,0.06), 0 1px 2px rgba(16,36,86,0.04);
      --sh-md: 0 8px 24px rgba(20,46,110,0.08), 0 2px 6px rgba(20,46,110,0.05);
      --sh-lg: 0 20px 48px rgba(20,46,110,0.12), 0 6px 16px rgba(20,46,110,0.06);
      --sh-xl: 0 36px 80px rgba(20,46,110,0.16), 0 10px 28px rgba(20,46,110,0.08);
      --sh-glow: 0 24px 70px -18px rgba(51,98,238,0.45);
      --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
      --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;
      --s-9: 96px; --s-10: 128px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur: 220ms;
    }

    .t-eyebrow {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue-500);
    }
    .t-display {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(26px, 8vw, 64px);
      line-height: 1.08;
      letter-spacing: -0.022em;
      color: var(--ink-900);
    }
    .t-h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(22px, 6.5vw, 46px);
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--ink-900);
    }
    .t-h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(20px, 5.5vw, 34px);
      line-height: 1.18;
      letter-spacing: -0.015em;
      color: var(--ink-900);
    }
    .t-h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--ink-900);
    }
    .t-lead {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(17px, 1.5vw, 19px);
      line-height: 1.6;
      color: var(--slate-600);
    }
    .t-body {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 15.5px;
      line-height: 1.62;
      color: var(--slate-600);
    }
    .t-small {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--slate-500);
    }
    .t-mono {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--ink-700);
    }
    .t-mono-tag {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--blue-600);
    }
    .text-gradient {
      background: var(--grad-brand);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ============================================================
       WEBSITE UI KIT — Structural & Component Styles
    ============================================================ */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--slate-600);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
    .section { position: relative; }
    .section-pad { padding: 104px 0; }
    .center { text-align: center; }
    .relative { position: relative; }

    .page-atmos {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 520px at 78% -4%, rgba(89,173,237,0.16), transparent 60%),
        radial-gradient(760px 520px at 8% 6%, rgba(51,98,238,0.10), transparent 55%),
        linear-gradient(180deg, #FFFFFF 0%, #FBFCFF 100%);
    }

    .dotgrid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(51,98,238,0.16) 1px, transparent 1.4px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 75%);
              mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 75%);
    }
    .glow {
      position: absolute; border-radius: 50%; pointer-events: none;
      filter: blur(60px); opacity: 0.55;
    }

    /* NAV */
    .nav-shell { position: sticky; top: 0; z-index: 50; padding: 16px 0; }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 12px 22px;
      background: var(--surface-glass);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
              backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--sh-md), inset 0 1px 0 rgba(255,255,255,0.6);
      border-radius: var(--r-pill);
    }
    .nav-brand { display: flex; align-items: center; gap: 11px; }
    .nav-mark {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--grad-brand);
      display: grid; place-items: center;
      box-shadow: var(--sh-sm), inset 0 1px 0 rgba(255,255,255,0.35);
      color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 19px;
      letter-spacing: -0.04em;
    }
    .nav-word { display: flex; flex-direction: column; line-height: 1; }
    .nav-word b { font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--ink-900); letter-spacing: -0.01em; }
    .nav-word span { font-family: var(--font-body); font-weight: 600; font-size: 9.5px; letter-spacing: 0.32em; color: var(--blue-500); margin-top: 3px; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      font-size: 14px; font-weight: 500; color: var(--slate-600);
      padding: 9px 14px; border-radius: var(--r-pill);
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .nav-link:hover { color: var(--ink-900); background: rgba(51,98,238,0.07); }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: var(--font-body); font-weight: 600; font-size: 14.5px;
      padding: 12px 20px; border-radius: var(--r-pill);
      cursor: pointer; border: 1px solid transparent;
      transition: transform 160ms var(--ease), box-shadow var(--dur) var(--ease),
                  background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; transition: transform var(--dur) var(--ease); }
    .btn-primary {
      background: var(--grad-brand); color: #fff;
      box-shadow: 0 8px 20px -6px rgba(51,98,238,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn-primary:hover { box-shadow: 0 14px 30px -8px rgba(51,98,238,0.6), inset 0 1px 0 rgba(255,255,255,0.35); transform: translateY(-2px); }
    .btn-primary:hover svg { transform: translate(2px,-2px); }
    .btn-primary:active { transform: translateY(0) scale(0.985); background: var(--blue-700); }
    .btn-ghost {
      background: #fff; color: var(--ink-900);
      border-color: var(--line-200); box-shadow: var(--sh-xs);
    }
    .btn-ghost:hover { border-color: var(--blue-200); color: var(--blue-600); transform: translateY(-2px); box-shadow: var(--sh-sm); }
    .btn-ghost:hover svg { transform: translate(2px,-2px); }
    .btn-sm { padding: 9px 16px; font-size: 13.5px; }

    /* EYEBROW / BADGES / CHIPS */
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; }
    .eyebrow .rule { width: 26px; height: 1.5px; background: linear-gradient(90deg, var(--blue-300), var(--blue-500)); }
    .eyebrow .txt { font-weight: 700; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--blue-600); }

    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px 7px 11px; border-radius: var(--r-pill);
      background: #fff; border: 1px solid var(--line-200);
      font-size: 12.5px; font-weight: 600; color: var(--ink-700);
      box-shadow: var(--sh-xs); white-space: nowrap;
    }
    .badge svg { width: 14px; height: 14px; color: var(--blue-500); }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }

    .chip {
      width: 50px; height: 50px; border-radius: var(--r-md);
      display: grid; place-items: center; flex: none;
      background: var(--grad-brand); color: #fff;
      box-shadow: 0 10px 22px -8px rgba(51,98,238,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .chip svg { width: 23px; height: 23px; }
    .chip-soft {
      background: var(--blue-50); color: var(--blue-600);
      box-shadow: inset 0 0 0 1px var(--blue-100);
    }

    /* CARDS */
    .card {
      background: var(--surface); border: 1px solid var(--line-200);
      border-radius: var(--r-lg); box-shadow: var(--sh-md);
      transition: transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
    }
    .card-hover:hover { transform: translateY(-5px); box-shadow: var(--sh-lg); border-color: var(--blue-200); }
    .card-pad { padding: 28px; }

    .section-head { max-width: 660px; margin: 0 auto 56px; text-align: center; }
    .section-head .eyebrow { margin-bottom: 18px; }
    .section-head p { margin: 16px auto 0; max-width: 560px; }

    /* HERO */
    .hero { padding: 64px 0 92px; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
    .hero h1 { margin: 22px 0 0; }
    .hero .lead { margin: 22px 0 0; max-width: 520px; }
    .hero-cta { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
    .hero-badges { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }

    .hero-visual { position: relative; display: grid; place-items: center; min-height: 470px; }
    .hero-visual .web3-glow {
      position: absolute; z-index: 1; width: 470px; height: 470px;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }

    /* Web3 orb visual */
    .web3orb-wrap { position: relative; display: grid; place-items: center; min-height: 470px; }
    .web3-glow {
      position: absolute; width: 440px; height: 440px; border-radius: 50%;
      background: radial-gradient(circle, rgba(51,98,238,0.42), rgba(89,173,237,0.18) 45%, transparent 68%);
      filter: blur(46px);
    }
    .orbit-ring {
      position: absolute; top: 50%; left: 50%;
      border: 1.5px solid rgba(89,173,237,0.32); border-radius: 50%;
      pointer-events: none;
    }
    .planet {
      position: relative; width: 340px; height: 340px; border-radius: 50%;
      background: radial-gradient(130px 130px at 38% 30%, #2E5BD8 0%, #1A3784 40%, #0C1630 80%);
      box-shadow:
        inset -32px -30px 76px rgba(0,0,0,0.55),
        inset 22px 18px 60px rgba(89,173,237,0.22),
        0 34px 90px -24px rgba(12,22,48,0.6);
      overflow: hidden;
    }
    .planet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .specular {
      position: absolute; width: 120px; height: 90px; top: 38px; left: 64px;
      background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
      filter: blur(14px); pointer-events: none; z-index: 2;
    }
    .spin-slow { transform-origin: center; animation: spin 80s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .token {
      position: absolute; z-index: 5; display: flex; align-items: center; gap: 9px;
      background: var(--surface-glass);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
              backdrop-filter: blur(12px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: var(--sh-lg); border-radius: var(--r-pill);
      padding: 8px 14px 8px 8px;
    }
    .token .tk {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      display: grid; place-items: center; color: #fff;
      font-family: var(--font-display); font-weight: 800; font-size: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .token .lb { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-900); }
    .float-y { animation: floaty 6s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @media (prefers-reduced-motion: reduce) {
      .spin-slow, .float-y { animation: none; }
    }

    /* trust bar */
    .trustbar { margin-top: 76px; }
    .trustbar .lbl { text-align:center; font-size: 12px; font-weight:600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate-400); margin-bottom: 22px; }
    .trustbar .row { display:flex; align-items:center; justify-content: space-between; flex-wrap: wrap; gap: 24px; }
    .trustbar .item { display:flex; align-items:center; gap: 10px; color: var(--slate-500); font-weight: 700; font-size: 15px; }
    .trustbar .item svg { width: 19px; height: 19px; color: var(--blue-400); }

    /* FEATURE GRID */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .grid-5-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

    .feature h3 { margin: 20px 0 9px; }
    .feature p { margin: 0; }
    .feature .more {
      display: inline-flex; align-items: center; gap: 7px; margin-top: 18px;
      font-weight: 600; font-size: 13.5px; color: var(--blue-600);
    }
    .feature .more svg { width: 15px; height: 15px; transition: transform var(--dur) var(--ease); }
    .card-hover:hover .feature .more svg { transform: translateX(4px); }

    /* PHOENIX SWAP split */
    .product-split { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 56px; align-items: center; }
    .product-points { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
    .ppoint { display:flex; gap: 13px; align-items: flex-start; }
    .ppoint .tick { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--success-bg); color: var(--success); display:grid; place-items:center; margin-top: 1px; }
    .ppoint .tick svg { width: 15px; height: 15px; }
    .ppoint .tx b { display:block; font-family: var(--font-display); font-weight: 700; font-size: 15.5px; color: var(--ink-900); }
    .ppoint .tx span { font-size: 14px; color: var(--slate-600); }

    /* trading screen art */
    .trade-wrap { position: relative; display: grid; place-items: center; }
    .trade-glow {
      position: absolute; inset: -6%; z-index: 0; pointer-events: none;
      background: radial-gradient(60% 60% at 55% 50%, rgba(89,173,237,0.22), transparent 72%);
      filter: blur(40px);
    }
    .trade-art {
      position: relative; z-index: 1; width: 100%; max-width: 560px; display: block;
      border-radius: 22px;
      -webkit-mask-image: radial-gradient(78% 78% at 50% 50%, #000 60%, transparent 88%);
              mask-image: radial-gradient(78% 78% at 50% 50%, #000 60%, transparent 88%);
    }

    /* blue panel */
    .panel {
      position: relative; border-radius: var(--r-xl); overflow: hidden;
      background: linear-gradient(160deg, #102A6B 0%, #1B3FA8 55%, #2A57D6 100%);
      box-shadow: var(--sh-xl);
      padding: 36px; color: #fff; min-height: 380px;
    }
    .panel .dotgrid { background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1.4px); opacity: 0.6; }
    .panel-glow { position:absolute; width: 320px; height: 320px; border-radius:50%; background: radial-gradient(circle, rgba(89,173,237,0.7), transparent 70%); filter: blur(30px); top: -60px; right: -60px; }

    /* HOW IT WORKS */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; position: relative; }
    .step { position: relative; }
    .step .num {
      font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      color: var(--blue-500); display:flex; align-items:center; gap: 10px; margin-bottom: 18px;
    }
    .step .num .big { font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--blue-100); line-height: 1; letter-spacing: -0.03em; }

    /* STATS BAND */
    .statsband {
      background: linear-gradient(180deg, #FFFFFF, var(--bg-tint));
      border: 1px solid var(--line-200); border-radius: var(--r-xl);
      box-shadow: var(--sh-md); padding: 40px 44px;
      display: grid; grid-template-columns: 1.15fr repeat(3, 0.95fr); gap: 30px; align-items: center;
    }
    .stat .v { font-family: var(--font-display); font-weight: 800; font-size: 38px; color: var(--blue-600); letter-spacing: -0.02em; }
    .stat .k { font-weight: 700; font-size: 14.5px; color: var(--ink-900); margin-top: 4px; }
    .stat .s { font-size: 13px; color: var(--slate-500); margin-top: 3px; }

    /* OPERATOR + CONTACT */
    .info-card { padding: 26px; }
    .info-card .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--blue-600); font-weight: 600; }
    .info-card h3 { margin: 12px 0 10px; }
    .info-card p { margin: 0; font-size: 14px; }
    .info-card .meta { margin-top: 14px; font-family: var(--font-mono); font-size: 12.5px; color: var(--slate-600); }

    .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .contact-item { display:flex; gap: 16px; align-items: flex-start; }
    .contact-item .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--slate-500); }
    .contact-item .v { font-family: var(--font-mono); font-size: 15px; color: var(--ink-900); font-weight: 600; margin-top: 6px; }

    /* CTA BAND */
    .ctaband {
      position: relative; overflow: hidden;
      background: linear-gradient(155deg, #0C1630 0%, #14275C 55%, #1E3C8C 100%);
      border-radius: var(--r-xl); box-shadow: var(--sh-xl);
      padding: 56px 56px; color: #fff;
      display:flex; align-items:center; justify-content: space-between; gap: 40px; flex-wrap: wrap;
    }
    .ctaband h2 { color: #fff; margin: 0; }
    .ctaband p { color: rgba(255,255,255,0.7); margin: 12px 0 0; max-width: 440px; }
    .ctaband .glow { width: 360px; height: 360px; background: radial-gradient(circle, rgba(51,98,238,0.9), transparent 70%); top: -120px; right: 10%; opacity: 0.5; }
    .btn-on-dark { background:#fff; color: var(--blue-700); }
    .btn-on-dark:hover { background: var(--blue-50); transform: translateY(-2px); }

    /* FOOTER */
    .footer { background: var(--navy-900); color: rgba(255,255,255,0.62); padding: 56px 0 30px; margin-top: 0; }
    .footer-top { display:flex; justify-content: space-between; gap: 40px; flex-wrap: wrap; padding-bottom: 34px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .footer-logo { height: 30px; opacity: 0.95; }
    .footer-cols { display:flex; gap: 64px; flex-wrap: wrap; }
    .footer-col h5 { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin: 0 0 14px; font-weight: 700; }
    .footer-col a, .footer-col span { display:block; font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 11px; transition: color var(--dur) var(--ease); }
    .footer-col a:hover { color: #fff; }
    .footer-disclaimer { font-size: 12px; line-height: 1.7; color: rgba(255,255,255,0.45); max-width: 760px; margin-top: 26px; }
    .footer-bottom { display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 14px; margin-top: 22px; font-size: 12.5px; color: rgba(255,255,255,0.5); }

    /* Lucide default sizing */
    [data-lucide] { width: 20px; height: 20px; }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out); }
    .reveal.in { opacity: 1; transform: none; }

    /* ── HAMBURGER BUTTON ── */
    .nav-burger {
      display: none;
      align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      padding: 8px; color: var(--ink-900);
      border-radius: var(--r-sm);
      transition: background var(--dur) var(--ease);
      flex-shrink: 0;
    }
    .nav-burger:hover { background: rgba(51,98,238,0.08); }
    .nav-burger svg { width: 22px; height: 22px; }

    /* ── MOBILE SLIDE-DOWN MENU ── */
    .nav-mobile-menu {
      margin-top: 10px;
      background: var(--surface-glass);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
              backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-lg);
      padding: 8px;
      animation: mobileMenuIn 200ms var(--ease-out) both;
    }
    @keyframes mobileMenuIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: none; }
    }
    .nav-mobile-link {
      display: block;
      padding: 13px 18px;
      font-size: 15px; font-weight: 500;
      color: var(--ink-900);
      border-radius: var(--r-md);
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .nav-mobile-link:hover { background: rgba(51,98,238,0.07); color: var(--blue-600); }
    .nav-mobile-link:active { background: rgba(51,98,238,0.12); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1080px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-5-strip { grid-template-columns: repeat(3, 1fr) !important; }
    }
    @media (max-width: 920px) {
      .hero-grid, .product-split { grid-template-columns: 1fr; gap: 36px; }
      .grid-3, .steps, .contact-grid { grid-template-columns: 1fr; }
      .statsband { grid-template-columns: 1fr 1fr; gap: 28px; }
      .nav-links { display: none; }
      .nav-burger { display: flex; }
      .hero-visual { min-height: 320px; }
      .trustbar .row { justify-content: center; gap: 16px; }
    }
    @media (max-width: 640px) {
      .section-pad { padding: 64px 0; }
      .wrap { padding: 0 18px; }
      .grid-5-strip { grid-template-columns: 1fr 1fr !important; }
      .hero { padding: 36px 0 56px; }
      .hero-visual { min-height: 260px; }
      .hero-badges { gap: 8px; }
      .badge { font-size: 11.5px; padding: 6px 11px 6px 9px; }
      .section-head { margin-bottom: 36px; }
      .t-lead { font-size: 15px; line-height: 1.55; }
      .t-body { font-size: 14.5px; }
      .card-pad { padding: 22px; }
      .step .num .big { font-size: 30px; }
      .ctaband { padding: 32px 22px; flex-direction: column; align-items: flex-start; gap: 24px; }
      .ctaband h2 { font-size: clamp(18px, 5vw, 26px); }
      .trustbar { margin-top: 44px; }
      .trustbar .item { font-size: 13px; }
    }
    @media (max-width: 420px) {
      .grid-4, .grid-2 { grid-template-columns: 1fr; }
      .grid-5-strip { grid-template-columns: 1fr !important; }
      .statsband { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
      .section-pad { padding: 52px 0; }
      .wrap { padding: 0 16px; }
      .nav-shell { padding: 12px 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Lucide icon wrapper ── */
    function Ic({ name, size = 20, className = "", style }) {
      return (
        <i data-lucide={name} width={size} height={size} className={className}
          style={{ width: size, height: size, display: "inline-flex", ...style }} />
      );
    }

    function Eyebrow({ children, center }) {
      return (
        <div className="eyebrow" style={center ? { justifyContent: "center" } : undefined}>
          <span className="rule" />
          <span className="txt">{children}</span>
          {center && <span className="rule" />}
        </div>
      );
    }

    function Button({ variant = "primary", size, icon, children, href = "#", onDark, style }) {
      const cls = [
        "btn",
        onDark && variant === "primary" ? "btn-on-dark" : `btn-${variant}`,
        size === "sm" ? "btn-sm" : "",
      ].filter(Boolean).join(" ");
      return (
        <a className={cls} href={href} style={style}>
          {children}
          {icon && <Ic name={icon} size={16} />}
        </a>
      );
    }

    function Badge({ icon, dot, children }) {
      return (
        <span className="badge">
          {dot && <span className="dot" />}
          {icon && <Ic name={icon} size={14} />}
          {children}
        </span>
      );
    }

    function Chip({ icon, soft }) {
      return (
        <div className={"chip" + (soft ? " chip-soft" : "")}>
          <Ic name={icon} size={soft ? 22 : 23} />
        </div>
      );
    }

    function SectionHead({ eyebrow, title, sub }) {
      return (
        <div className="section-head reveal">
          <Eyebrow center>{eyebrow}</Eyebrow>
          <h2 className="t-h2" style={{ marginTop: 18 }}>{title}</h2>
          {sub && <p className="t-lead">{sub}</p>}
        </div>
      );
    }

    /* network constellation graphic for blue panels */
    function NetGraphic() {
      const nodes = [
        [78, 60],[180, 40],[262, 96],[120, 150],[228, 186],
        [60, 210],[300, 60],[170, 250],[40, 120],[290, 240],
      ];
      const links = [[0,1],[1,2],[0,3],[3,4],[2,4],[0,5],[3,7],[4,9],[1,6],[6,2],[5,8],[7,9],[8,0]];
      return (
        <svg viewBox="0 0 340 290" style={{ position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.9 }}>
          {links.map(([a,b],i) => (
            <line key={i} x1={nodes[a][0]} y1={nodes[a][1]} x2={nodes[b][0]} y2={nodes[b][1]}
              stroke="rgba(255,255,255,0.28)" strokeWidth="1" />
          ))}
          {nodes.map(([x,y],i) => (
            <g key={i}>
              <circle cx={x} cy={y} r={i%3===0?5:3}
                fill={i%3===0?"#9CCBF5":"rgba(255,255,255,0.85)"} />
              {i%3===0 && <circle cx={x} cy={y} r="11" fill="none" stroke="rgba(156,203,245,0.5)" strokeWidth="1" />}
            </g>
          ))}
        </svg>
      );
    }

    /* Web3 globe visual */
    function Web3Visual() {
      const C = 200, R = 158;
      const longs = [R, R*0.72, R*0.42, R*0.14];
      const latOffsets = [-120,-74,-26,26,74,120];
      const lats = latOffsets.map(off => {
        const rx = Math.sqrt(R*R - off*off);
        return { cy: C+off, rx, ry: rx*0.26 };
      });
      const nodeSpecs = [[0,0.6],[0,2.4],[1,1.1],[1,3.6],[2,0.4],[2,2.0],[3,1.6],[3,4.0],[4,0.9],[4,2.7],[5,1.8]];
      const nodes = nodeSpecs.map(([li,a],i) => {
        const L = lats[li];
        return { x: C+L.rx*Math.cos(a), y: L.cy+L.ry*Math.sin(a), big: i%3===0 };
      });
      const chords = [[0,4],[4,6],[6,9],[1,5],[5,7],[2,8],[8,10],[3,9]];
      const stroke = "rgba(140,185,250,0.45)";
      return (
        <div className="web3orb-wrap">
          <div className="web3-glow" />
          <div className="orbit-ring" style={{ width:460, height:210, transform:"translate(-50%,-50%) rotate(-24deg)" }} />
          <div className="orbit-ring" style={{ width:410, height:150, transform:"translate(-50%,-50%) rotate(16deg)", opacity:0.5 }} />
          <div className="planet">
            <div className="specular" />
            <svg viewBox="0 0 400 400" className="spin-slow">
              <defs>
                <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stopColor="#CFE9FF" />
                  <stop offset="100%" stopColor="#59ADED" />
                </radialGradient>
              </defs>
              <circle cx={C} cy={C} r={R} fill="none" stroke="rgba(160,200,255,0.55)" strokeWidth="1.2" />
              {longs.map((rx,i) => (
                <ellipse key={"lo"+i} cx={C} cy={C} rx={rx} ry={R} fill="none" stroke={stroke} strokeWidth="1" />
              ))}
              <line x1={C} y1={C-R} x2={C} y2={C+R} stroke={stroke} strokeWidth="1" />
              {lats.map((L,i) => (
                <ellipse key={"la"+i} cx={C} cy={L.cy} rx={L.rx} ry={L.ry} fill="none" stroke={stroke} strokeWidth="1" />
              ))}
              {chords.map(([a,b],i) => (
                <line key={"c"+i} x1={nodes[a].x} y1={nodes[a].y} x2={nodes[b].x} y2={nodes[b].y}
                  stroke="rgba(120,175,255,0.4)" strokeWidth="0.9" />
              ))}
              {nodes.map((n,i) => (
                <g key={"n"+i}>
                  {n.big && <circle cx={n.x} cy={n.y} r="9" fill="rgba(89,173,237,0.25)" />}
                  <circle cx={n.x} cy={n.y} r={n.big?3.6:2.2} fill={n.big?"url(#nodeGlow)":"#BFE0FF"} />
                </g>
              ))}
            </svg>
          </div>
          <div className="token float-y" style={{ top:22, left:-6, animationDelay:"0s" }}>
            <span className="tk" style={{ background:"linear-gradient(135deg,#2A4FD8,#3362EE)" }}>GEL</span>
            <span className="lb">Georgian Lari</span>
          </div>
          <div className="token float-y" style={{ bottom:96, right:-18, animationDelay:"1.4s" }}>
            <span className="tk" style={{ background:"linear-gradient(135deg,#1E9E6A,#26B47B)" }}>₮</span>
            <span className="lb">USDT · TRC20</span>
          </div>
          <div className="token float-y" style={{ bottom:12, left:40, animationDelay:"2.6s" }}>
            <span className="tk" style={{ background:"linear-gradient(135deg,#4A4F6B,#6B7392)" }}>Ξ</span>
            <span className="lb">ERC20</span>
          </div>
        </div>
      );
    }

    /* scroll reveal hook */
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll(".reveal");
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      });
    }

    /* ══════════════════════════════════════════════════════
       NAV
    ══════════════════════════════════════════════════════ */
    function Nav() {
      const [open, setOpen] = useState(false);
      const links = [
        ["Phoenix Swap", "#phoenix-swap"],
        ["How It Works", "#how-it-works"],
        ["Built for Trust", "#built-for-trust"],
        ["Company", "#company"],
        ["Contact", "#contact"],
      ];
      const close = () => setOpen(false);
      return (
        <div className="nav-shell">
          <div className="wrap">
            <nav className="nav">
              <a className="nav-brand" href="#top" onClick={close}>
                <img src="Logo/Logo.png" alt="Namix Prime" style={{ height: 34, display: "block" }} />
              </a>
              <div className="nav-links">
                {links.map(([l,h]) => (
                  <a key={l} className="nav-link" href={h}>{l}</a>
                ))}
              </div>
              <button className="nav-burger" onClick={() => setOpen(o => !o)}
                aria-label="Toggle menu" aria-expanded={open}>
                <Ic name={open ? "x" : "menu"} size={22} />
              </button>
            </nav>
            {open && (
              <div className="nav-mobile-menu">
                {links.map(([l,h]) => (
                  <a key={l} className="nav-mobile-link" href={h} onClick={close}>{l}</a>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       HERO
    ══════════════════════════════════════════════════════ */
    function Hero() {
      return (
        <header className="hero relative" id="top">
          <div className="dotgrid" style={{ inset:"auto 0 0 0", height:420, top:40 }} />
          <div className="wrap">
            <div className="hero-grid">
              <div>
                <div className="reveal">

              <div className="hero-visual reveal">

                <img

                  style={{
                    position: "relative", zIndex: 2,

                    display: "block",

            <div className="trustbar reveal">

              <div className="row">
                <div className="item"><Ic name="landmark" size={19} /> National Bank of Georgia rates</div>
                <div className="item"><Ic name="link-2" size={19} /> TRC20</div>
                <div className="item"><Ic name="link-2" size={19} /> ERC20</div>
                <div className="item"><Ic name="link-2" size={19} /> BEP20</div>

    }

    /* ══════════════════════════════════════════════════════
       PRODUCT — Phoenix Swap
    ══════════════════════════════════════════════════════ */
    function ProductSection() {

              <div className="reveal trade-wrap">

    /* Swap card widget */

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:16 }}>

    function SwapRow({ label, amount, coinBg, coinLabel, name, net }) {

          display:"flex", alignItems:"center", justifyContent:"space-between",

          padding:"15px 16px", boxShadow:"var(--sh-xs)",

            <div style={{ fontSize:11, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase", color:"var(--slate-500)" }}>{label}</div>
